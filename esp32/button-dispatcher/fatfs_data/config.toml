# button-dispatcher configuration (edit on the USB drive that the device shows, or before flashing).
# Secrets (keys ending in _password, _key or _token) are moved into private storage at the next boot and
# commented out here as `# key = "***"`; to change one, add a line with the new value again.
# Everything else (buttons, bindings, SwitchBot credentials, password) is set on the web page.
# The network name is <hostname>-<Wi-Fi MAC>, for example dispatcher-24-0a-c4-12-34-56.local, so
# boards flashed with the same files get different names. To give one board its own name, add keys with its
# MAC (the web page's Settings tab shows the lines to copy):
#   board.24-0a-c4-12-34-56.hostname = "dispatcher"
#   board.24-0a-c4-12-34-56.hostname_append_mac = false
hostname = "dispatcher"
hostname_append_mac = true
http_port = 80

# Optional status LED. -1 disables it. GPIO21 is the XIAO ESP32-S3's yellow LED (active low) and
# the pin the ESP32-S3-DevKitC-1 Row A "21" can drive an external LED from.
led_pin = 21
led_active_low = true

# Optional acknowledgement buzzer. -1 disables it. GPIO9 is D10 on the XIAO ESP32-S3, next to 3V3.
# A passive buzzer, wired straight from the pin to GND, sounded with a square wave of buzzer_frequency_hz.
buzzer_pin = 9
buzzer_frequency_hz = 880

# Primary Wi-Fi access point (2.4 GHz)
wifi_ssid = "YOUR_WIFI_SSID"
wifi_password = "YOUR_WIFI_PASSWORD"

# Fallback access points (optional, indices 1 to 9)
# wifi_ssid1 = "BackupHotspot"
# wifi_password1 = "HotspotPass"
