# nsbackend-pico Configuration
hostname = "nscon"
tcp_port = 10100
log = true
enable_echo = true
led_active_low = false

# Primary Wi-Fi Access Point (Index 0)
wifi_ssid = "YOUR_WIFI_SSID"
wifi_password = "YOUR_WIFI_PASSWORD"

# Fallback Wi-Fi Access Points (Optional: indices 1 to 9)
# wifi_ssid1 = "BackupHotspot"
# wifi_password1 = "HotspotPass"

# USB Host Port (USB-A controller pass-through over PIO-USB)
# D+ connects to usb_host_dp_pin, D- to the next GPIO (default: GP16 D+, GP17 D-).
usb_host_enabled = true
usb_host_dp_pin = 16
# Stick deadzone in percent of full deflection
usb_host_deadzone_percent = 10

# I2C Matrix Keypad (PCF8574 / PCF8574A)
i2c_keypad_enabled = true
i2c_sda_pin = 20
i2c_scl_pin = 21
i2c_address = 0x20
i2c_reverse_row = true
i2c_reverse_col = true
i2c_debounce_ms = 20

